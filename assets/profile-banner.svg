<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Eden — Digital sketchbook</title>
  <desc id="description">A dark violet creative notebook with lavender and peach lettering, an abstract sketch window, and orbiting ideas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191727" />
      <stop offset="1" stop-color="#242039" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7a2ff" />
      <stop offset="1" stop-color="#ffc39e" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b7a2ff" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#background)" />
  <rect width="1200" height="440" rx="24" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="392" rx="16" fill="none" stroke="#c9bded" stroke-opacity="0.14" />

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="65" cy="65" r="5" fill="#ffc39e" />
    <text x="82" y="71" font-size="14" letter-spacing="3" fill="#d7cfee">IDEAS IN PROGRESS</text>
    <text x="62" y="154" font-size="66" font-weight="700" letter-spacing="-2" fill="#f7f3ff">Eden<tspan fill="#ffc39e">.</tspan></text>
    <text x="64" y="204" font-size="27" font-weight="500" fill="#c6b6ff">Digital sketchbook / Sổ tay ý tưởng</text>

    <path d="M65 233 C180 222 275 244 408 228" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
    <text x="64" y="281" font-size="18" fill="#e0d9ef">Nơi những ý tưởng thành hình.</text>
    <text x="64" y="312" font-size="18" fill="#b9afcf">Where ideas take shape.</text>

    <g font-family="Consolas, monospace" font-size="14" fill="#b9afcf">
      <text x="64" y="380">01 IMAGINE</text>
      <text x="207" y="380" fill="#ffc39e">/</text>
      <text x="235" y="380">02 MAKE</text>
      <text x="351" y="380" fill="#ffc39e">/</text>
      <text x="379" y="380">03 REFINE</text>
    </g>
  </g>

  <g transform="translate(747 76)">
    <ellipse cx="177" cy="139" rx="184" ry="133" transform="rotate(-21 177 139)" fill="none" stroke="#b7a2ff" stroke-opacity="0.3" stroke-dasharray="5 9" />
    <circle cx="324" cy="51" r="9" fill="#ffc39e" />
    <circle cx="35" cy="233" r="6" fill="#b7a2ff" />

    <g transform="rotate(-7 169 139)">
      <rect x="24" y="29" width="288" height="224" rx="14" fill="#11101b" fill-opacity="0.4" />
      <rect x="14" y="19" width="288" height="224" rx="14" fill="#302943" stroke="#8976b9" stroke-width="1.5" />
      <path d="M15 57 H301" stroke="#8976b9" stroke-opacity="0.5" />
      <circle cx="35" cy="38" r="4" fill="#ffc39e" />
      <circle cx="50" cy="38" r="4" fill="#b7a2ff" />
      <circle cx="65" cy="38" r="4" fill="#8f82a9" />
      <text x="91" y="42" fill="#d7cfee" font-family="Consolas, monospace" font-size="11">untitled-idea</text>

      <path d="M96 102 L62 129 L96 156 M220 102 L254 129 L220 156" fill="none" stroke="#c6b6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M176 91 L144 167" fill="none" stroke="#ffc39e" stroke-width="6" stroke-linecap="round" />
      <path d="M61 191 H166 M61 207 H218" stroke="#807197" stroke-width="4" stroke-linecap="round" />
    </g>

    <g transform="translate(267 179) rotate(9)">
      <rect width="79" height="79" rx="18" fill="url(#accent)" />
      <path d="M39.5 16 L45.5 33.5 L63 39.5 L45.5 45.5 L39.5 63 L33.5 45.5 L16 39.5 L33.5 33.5 Z" fill="#272034" />
    </g>
    <path d="M22 15 V33 M13 24 H31" stroke="#ffc39e" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
